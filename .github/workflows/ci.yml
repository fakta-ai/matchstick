# The checks every pull request and every commit on main passes, as parallel jobs; `check` passes only when each job
# this run needs passed and every other one was skipped. A pull request runs the Go checks only when what Go builds or
# tests changes, and a GoReleaser snapshot only when the release's configuration changes; every commit on main runs
# the Go checks and builds every release target. On main, once `check` passed, the same run releases the version
# CHANGELOG.md names if it isn't released yet (release.yml).
# Caches: GitHub scopes them by branch, so a pull request reads main's and writes only its own; runs on main write
# main's, which the release reads. The `go` job keeps setup-go's (linux/amd64 and race builds); `release-build` keeps
# its own key with every release target's build cache, which the snapshot and the release only restore.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  # a pull request's newer commit replaces its older run; each commit on main keeps its own run, with its release
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # which of the jobs that depend on the files changed a pull request needs
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      go: ${{ steps.files.outputs.go }}
      release: ${{ steps.files.outputs.release }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # every path the pull request changes, a rename's old path too; a failed call fails the step
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')
          go=false release=false
          while IFS= read -r file; do
            # what Go builds or tests: Go files, embedded files and test fixtures, the examples the tests run, the
            # modules, the linter's configuration, this workflow
            case $file in
              *.go | cmd/* | internal/* | examples/* | go.mod | go.sum | .golangci.yml | .github/workflows/ci.yml) go=true ;;
            esac
            case $file in
              .goreleaser.yaml | .github/workflows/release.yml) release=true ;;
            esac
          done <<< "$files"
          echo "go: $go, release: $release"
          printf 'go=%s\nrelease=%s\n' "$go" "$release" >> "$GITHUB_OUTPUT"

  go:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - name: lint and render
        run: |
          set -euo pipefail
          for values in deploy/chart/matchstick/values.yaml deploy/chart/matchstick/ci/azure-values.yaml; do
            helm lint deploy/chart/matchstick --values "$values"
            helm template matchstick deploy/chart/matchstick --values "$values" > /dev/null
          done

  # the workflows' own decisions, against fixtures: the review gate's one exception (Dependabot's flake.lock-only pull
  # requests) and the release's (which version, the tag, the end-to-end wait)
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the runner has bash, jq and yq
      - run: bash .github/tests/codex.sh
      - run: bash .github/tests/release.sh

  # every release target built as the release builds it, published nowhere; its Go caches, under a key of their own,
  # are what the snapshot and the release restore. The key changes with the modules, the Go version and the release's
  # build settings; while it exists, there is nothing to do.
  release-build:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: cached
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: release-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', '.goreleaser.yaml') }}
          lookup-only: true
      - if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # the previous key's caches, if any: only what changed is built again
      - if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.cached.outputs.cache-primary-key }}
          restore-keys: release-build-${{ runner.os }}-
      - if: steps.cached.outputs.cache-hit != 'true'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: build --snapshot --clean
      - if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.cached.outputs.cache-primary-key }}

  # what a release would publish, built without publishing: archives, checksums, SBOMs, and the image loaded into the
  # runner's Docker (linux/amd64)
  snapshot:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # main's caches of every release target (release-build), read only
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: release-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', '.goreleaser.yaml') }}
          restore-keys: release-build-${{ runner.os }}-
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --snapshot --clean --skip=sign
      - name: the image runs
        run: |
          set -euo pipefail
          image=$(jq -r '.[] | select(.type == "Docker Manifest") | .name' dist/artifacts.json)
          docker run --rm "$image" --version

  check:
    if: always()
    needs: [changes, go, chart, workflows, release-build, snapshot]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          GO: ${{ needs.changes.outputs.go }}
          RELEASE: ${{ needs.changes.outputs.release }}
        run: |
          set -euo pipefail
          # the jobs this run needs; every other one must have been skipped
          want="chart workflows"
          if [ "$EVENT" = pull_request ]; then
            want+=" changes"
            if [ "$GO" = true ]; then want+=" go"; fi
            if [ "$RELEASE" = true ]; then want+=" snapshot"; fi
          else
            want+=" go release-build"
          fi
          failed=0
          for job in $(jq -r 'keys[]' <<< "$NEEDS"); do
            result=$(jq -r --arg job "$job" '.[$job].result' <<< "$NEEDS")
            case " $want " in
              *" $job "*) expected=success ;;
              *) expected=skipped ;;
            esac
            if [ "$result" = "$expected" ]; then
              echo "$job: $result"
            else
              echo "::error::$job: $result, expected $expected"
              failed=1
            fi
          done
          exit "$failed"

  # the version CHANGELOG.md names, released if it isn't yet; the permissions are the most any of its jobs takes, and
  # each job takes only its own
  release:
    needs: check
    if: github.event_name == 'push'
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      statuses: read
    uses: ./.github/workflows/release.yml
