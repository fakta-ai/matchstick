name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ hashFiles('go.sum') }}
          restore-keys: go-
      # The flake's dev shell has the Go toolchain, golangci-lint and govulncheck.
      - name: vet
        run: nix develop -c go vet ./...
      - name: test
        run: nix develop -c go test -race ./...
      - name: lint
        run: nix develop -c golangci-lint run ./...
      - name: vulnerabilities
        run: nix develop -c govulncheck ./...
      - name: chart
        run: nix develop -c helm lint deploy/chart/matchstick
      - name: build
        run: nix build .#matchstick .#image
