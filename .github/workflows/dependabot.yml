# Dependabot's pull requests merge by themselves once the default branch's ruleset is satisfied: `check` passed, and
# `codex`, which passes one that changes only flake.lock (codex.yml) and waits for a review otherwise.
name: dependabot
on: pull_request
permissions:
  contents: write
  pull-requests: write
jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR"
