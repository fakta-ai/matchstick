# A version tag (vX.Y.Z) builds the binaries and the container image, and publishes them as a GitHub release and
# ghcr.io/fakta-ai/matchstick:<version>.
name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*} arch=${target#*/}
            out="matchstick_${VERSION#v}_${os}_${arch}"
            mkdir "$out"
            for cmd in matchstick matchstick-adapter; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch nix develop -c go build -trimpath \
                -ldflags "-s -w -X main.version=${VERSION#v}" -o "$out/$cmd" "./cmd/$cmd"
            done
            cp LICENSE README.md "$out/"
            tar -czf "dist/$out.tar.gz" "$out"
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
      - name: notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # The version's section of CHANGELOG.md.
          awk -v v="${VERSION#v}" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for ${VERSION#v}"; exit 1; }
      - name: image
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          image=ghcr.io/${{ github.repository_owner }}/matchstick:${VERSION#v}
          nix build .#image --out-link stream-image
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          ./stream-image | docker load
          docker tag "matchstick:$(nix eval --raw .#packages.x86_64-linux.image.imageTag)" "$image"
          docker push "$image"
      - name: publish
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" dist/* --title "$VERSION" --notes-file notes.md --verify-tag
