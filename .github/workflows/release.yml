# A version tag (vX.Y.Z) builds the binaries, the container image and the Helm chart, and publishes them as a GitHub
# release, ghcr.io/<owner>/matchstick:<version> and oci://ghcr.io/<owner>/charts/matchstick:<version>. The image and
# the chart are signed with Sigstore, keyless: the signature's certificate names this workflow at the tag, and is
# recorded in Sigstore's public transparency log. The release notes give both digests.
name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      # the OIDC token Sigstore issues the signing certificate for
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*} arch=${target#*/}
            out="matchstick_${VERSION#v}_${os}_${arch}"
            mkdir "$out"
            for cmd in matchstick matchstick-adapter; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch nix develop -c go build -trimpath \
                -ldflags "-s -w -X main.version=${VERSION#v}" -o "$out/$cmd" "./cmd/$cmd"
            done
            cp LICENSE README.md "$out/"
            tar -czf "dist/$out.tar.gz" "$out"
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
      - name: notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # The version's section of CHANGELOG.md.
          awk -v v="${VERSION#v}" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for ${VERSION#v}"; exit 1; }
      - name: image
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
        run: |
          image=ghcr.io/$OWNER/matchstick:${VERSION#v}
          nix build .#image --out-link stream-image
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          ./stream-image | docker load
          docker tag "matchstick:$(nix eval --raw .#packages.x86_64-linux.image.imageTag)" "$image"
          docker push "$image"
          ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
          nix develop -c cosign sign --yes "$ref"
          printf '\n**Image:** `%s`\n' "$ref" >> notes.md
      - name: chart
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
        run: |
          # the chart's version and appVersion are the release's, so its default image is this release's
          nix develop -c helm package deploy/chart/matchstick --version "${VERSION#v}" --app-version "${VERSION#v}" \
            --destination chart
          echo "$GH_TOKEN" | nix develop -c helm registry login ghcr.io -u "$ACTOR" --password-stdin
          nix develop -c helm push "chart/matchstick-${VERSION#v}.tgz" "oci://ghcr.io/$OWNER/charts" 2>&1 | tee push.log
          digest=$(awk '$1 == "Digest:" {print $2}' push.log)
          test -n "$digest" || { echo "helm push printed no digest"; exit 1; }
          nix develop -c cosign sign --yes "ghcr.io/$OWNER/charts/matchstick@$digest"
          printf '**Chart:** `oci://ghcr.io/%s/charts/matchstick:%s` (`%s`)\n' "$OWNER" "${VERSION#v}" "$digest" >> notes.md
      - name: publish
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" dist/* --title "$VERSION" --notes-file notes.md --verify-tag
