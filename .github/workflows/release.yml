# A release, run by ci.yml on main after `check` passed, in the same run. A release is a pull request that moves
# CHANGELOG.md's entries under a new version heading; when it merges, this workflow:
# 1. version: reads the newest version CHANGELOG.md names (the first `## [x.y.z]` below `## [Unreleased]`); nothing
#    more happens unless vx.y.z is untagged, or tagged on this commit and not yet released (a re-run);
# 2. tag: tags this commit vx.y.z;
# 3. goreleaser, chart: build everything once. The binaries, their SBOMs and signed checksums.txt go to a draft
#    release; the image (ghcr.io/fakta-ai/matchstick-staging) and the chart (ghcr.io/fakta-ai/charts-staging/matchstick)
#    go to staging repositories only, signed, with SBOMs, and with build provenance once the repository is public. The
#    chart's default image is that image's digest, under its public name, so the chart's signature covers the image it
#    runs;
# 4. e2e: when the repository variable RELEASE_E2E_CONTEXT is set, waits until the commit status with that context on
#    this commit is success and its description names the staged chart's digest (at most RELEASE_E2E_TIMEOUT minutes,
#    30 by default): an end-to-end system installs the staged chart (with the image's repository set to the staging
#    one), runs a real job with it and reports it there. A status naming another digest is an earlier run's and
#    doesn't count. When RELEASE_E2E_ACK_TIMEOUT is set too, the end-to-end system must acknowledge the build within
#    that many minutes, with any status naming its digest (pending as it starts, or its result); with none by then the
#    run fails at once rather than at RELEASE_E2E_TIMEOUT. Failure or timeout ends the run; the draft and the staged
#    digests stay;
# 5. promote: copies the staged image and chart, by digest and with their signatures, SBOMs and attestations, to
#    ghcr.io/fakta-ai/matchstick:<version> and ghcr.io/fakta-ai/charts/matchstick:<version>;
# 6. publish: publishes the draft, its notes the version's section of CHANGELOG.md with both digests;
# 7. verify: checks what was published, from the public names only. Nothing is rolled back.
# Signatures are Sigstore's, keyless; the certificate names this file at refs/heads/main.
name: release
on:
  workflow_call:
permissions: {}
env:
  IMAGE: ghcr.io/fakta-ai/matchstick
  IMAGE_STAGING: ghcr.io/fakta-ai/matchstick-staging
  CHART: ghcr.io/fakta-ai/charts/matchstick
  CHART_STAGING: ghcr.io/fakta-ai/charts-staging/matchstick
jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.version.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # the first version heading below "## [Unreleased]"
          heading=$(awk '/^## \[/ && !/^## \[Unreleased\]/ {print; exit}' CHANGELOG.md)
          if [ -z "$heading" ]; then
            echo "CHANGELOG.md names no version: nothing to release"
            echo release=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          re='^## \[([0-9]+\.[0-9]+\.[0-9]+)\]( - [0-9]{4}-[0-9]{2}-[0-9]{2})?$'
          if [[ ! $heading =~ $re ]]; then
            echo "::error::CHANGELOG.md's newest version heading is not '## [x.y.z] - YYYY-MM-DD': $heading"
            exit 1
          fi
          version=${BASH_REMATCH[1]}
          tags=$(gh api --paginate "repos/$REPO/git/matching-refs/tags/v" --jq '.[].ref | ltrimstr("refs/tags/")')
          if grep -qxF "v$version" <<< "$tags"; then
            read -r type sha <<< "$(gh api "repos/$REPO/git/ref/tags/v$version" --jq '"\(.object.type) \(.object.sha)"')"
            if [ "$type" = tag ]; then
              sha=$(gh api "repos/$REPO/git/tags/$sha" --jq .object.sha)
            fi
            if [ "$sha" != "$SHA" ]; then
              echo "v$version is tagged on $sha: nothing to release"
              release=false
            elif out=$(gh api "repos/$REPO/releases/tags/v$version" --jq .html_url 2>&1); then
              echo "v$version is released: $out"
              release=false
            elif grep -q 'HTTP 404' <<< "$out"; then
              echo "v$version is tagged on this commit and not released: releasing it"
              release=true
            else
              echo "::error::reading v$version's release: $out"
              exit 1
            fi
          else
            latest=$({ grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' <<< "$tags" || true; } | sort -V | tail -n 1)
            if [ -n "$latest" ] && [ "$(printf '%s\n' "$latest" "v$version" | sort -V | tail -n 1)" != "v$version" ]; then
              echo "::error::CHANGELOG.md's newest version, $version, is not above the latest tag, $latest"
              exit 1
            fi
            echo "v$version is new: releasing it"
            release=true
          fi
          printf 'release=%s\nversion=%s\n' "$release" "$version" >> "$GITHUB_OUTPUT"
          if [ "$release" = true ]; then
            # the version's section of CHANGELOG.md
            notes=$(awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md)
            test -n "$(tr -d '[:space:]' <<< "$notes")" || { echo "::error::CHANGELOG.md's section for $version is empty"; exit 1; }
            delimiter=$(openssl rand -hex 16)
            printf 'notes<<%s\n%s\n%s\n' "$delimiter" "$notes" "$delimiter" >> "$GITHUB_OUTPUT"
          fi

  tag:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      ok: ${{ steps.tag.outputs.ok }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # creating a ref fails if it exists, so of two runs racing for one version only one gets it
          if gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$SHA" --silent 2> error.log; then
            echo "tagged v$VERSION on $SHA"
            ok=true
          else
            # it exists: on this commit (a re-run) or on another one (a concurrent run took the version)
            ref=$(gh api "repos/$REPO/git/ref/tags/v$VERSION" --jq '"\(.object.type) \(.object.sha)"') || { cat error.log; exit 1; }
            read -r type sha <<< "$ref"
            if [ "$type" = tag ]; then
              sha=$(gh api "repos/$REPO/git/tags/$sha" --jq .object.sha)
            fi
            if [ "$sha" = "$SHA" ]; then
              echo "v$VERSION is already tagged on $SHA"
              ok=true
            else
              echo "::notice::v$VERSION was tagged on $sha by another run: nothing to release here"
              ok=false
            fi
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

  # the binaries, checksums, SBOMs and the staged image; signed; a draft release with the files
  goreleaser:
    needs: [version, tag]
    if: needs.tag.outputs.ok == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # the draft release and its files
      contents: write
      # the staged image, and its attestation
      packages: write
      # the OIDC token Sigstore issues the signing certificates for
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # main's caches of every release target (ci.yml's release-build), read only: only this repository's own
      # packages are compiled again
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: release-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', '.goreleaser.yaml') }}
          restore-keys: release-build-${{ runner.os }}-
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0
      # ko, cosign and the image's attestation read the login from Docker's configuration
      - name: registry login
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: notes
        env:
          NOTES: ${{ needs.version.outputs.notes }}
        run: printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: v${{ needs.version.outputs.version }}
      - name: image
        id: image
        run: |
          set -euo pipefail
          digest=$(jq -r '.[] | select(.type == "Docker Manifest") | .extra.Digest' dist/artifacts.json)
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::GoReleaser published no image: '$digest'"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Staged image: \`$IMAGE_STAGING@$digest\`" >> "$GITHUB_STEP_SUMMARY"
      # GitHub's attestations need a public repository, or GitHub Enterprise Cloud
      - if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
      - if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_STAGING }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  # the staged chart, its version and appVersion the release's, its default image the staged image's digest under the
  # image's public name, so its signature covers the image it runs; signed
  chart:
    needs: [version, tag, goreleaser]
    if: needs.tag.outputs.ok == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # the staged chart, and its attestation
      packages: write
      # the OIDC token Sigstore issues the signing certificate for
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      # helm push reads Helm's registry configuration; cosign and the chart's attestation read Docker's
      - name: registry login
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      # the image the chart runs unless told otherwise: the staged image's digest (image.digest wins over image.tag),
      # under the public name the release copies it to (values.yaml's image.repository)
      - name: pin the image
        id: pin
        env:
          DIGEST: ${{ needs.goreleaser.outputs.digest }}
        run: |
          set -euo pipefail
          [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no staged image digest: '$DIGEST'"; exit 1; }
          yq -i '.image.digest = strenv(DIGEST)' deploy/chart/matchstick/values.yaml
          echo "The chart's image: \`$(yq '.image.repository + "@" + .image.digest' deploy/chart/matchstick/values.yaml)\`" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: push
        id: push
        run: |
          set -euo pipefail
          helm package deploy/chart/matchstick --version "$VERSION" --app-version "$VERSION" --destination chart
          helm push "chart/matchstick-$VERSION.tgz" "oci://${CHART_STAGING%/*}" 2>&1 | tee push.log
          digest=$(awk '$1 == "Digest:" {print $2}' push.log)
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::helm push printed no digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Staged chart: \`$CHART_STAGING@$digest\`" >> "$GITHUB_STEP_SUMMARY"
      - name: sign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$CHART_STAGING@$DIGEST"
      # GitHub's attestations need a public repository, or GitHub Enterprise Cloud
      - if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.CHART_STAGING }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # the maintainers' end-to-end check of the staged image and chart, when RELEASE_E2E_CONTEXT is set; its
  # acknowledgement within RELEASE_E2E_ACK_TIMEOUT, when that is set too
  e2e:
    needs: [goreleaser, chart]
    runs-on: ubuntu-24.04
    # the wait's own limit is RELEASE_E2E_TIMEOUT
    timeout-minutes: 360
    permissions:
      statuses: read
    steps:
      - id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          DIGEST: ${{ needs.chart.outputs.digest }}
          CONTEXT: ${{ vars.RELEASE_E2E_CONTEXT }}
          TIMEOUT: ${{ vars.RELEASE_E2E_TIMEOUT || '30' }}
          ACK_TIMEOUT: ${{ vars.RELEASE_E2E_ACK_TIMEOUT }}
        run: |
          set -euo pipefail
          if [ -z "$CONTEXT" ]; then
            echo "RELEASE_E2E_CONTEXT is not set: no end-to-end check"
            exit 0
          fi
          minutes() { [[ $1 =~ ^[0-9]+$ ]] && [ "$1" -ge 1 ] && [ "$1" -le 350 ]; }
          minutes "$TIMEOUT" || { echo "::error::RELEASE_E2E_TIMEOUT must be minutes from 1 to 350: '$TIMEOUT'"; exit 1; }
          if [ -n "$ACK_TIMEOUT" ] && ! minutes "$ACK_TIMEOUT"; then
            echo "::error::RELEASE_E2E_ACK_TIMEOUT must be minutes from 1 to 350, or unset: '$ACK_TIMEOUT'"
            exit 1
          fi
          [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no staged chart digest: '$DIGEST'"; exit 1; }
          echo "waiting for $CONTEXT on $SHA naming the staged chart $DIGEST"
          deadline=$((SECONDS + TIMEOUT * 60))
          # acknowledged: a status of the context has named this run's chart, whatever its state; without an
          # acknowledgement timeout nothing waits for one
          acknowledged=false
          if [ -n "$ACK_TIMEOUT" ]; then
            ack_deadline=$((SECONDS + ACK_TIMEOUT * 60))
          else
            acknowledged=true
          fi
          while :; do
            # the newest status of each context on the commit, with its description
            status=$(gh api "repos/$REPO/commits/$SHA/status?per_page=100" \
              --jq '.statuses[] | select(.context == env.CONTEXT) | "\(.state) \(.description // "")"')
            state=${status%% *} description=${status#* }
            # a status that doesn't name this run's chart is about an earlier build of this commit
            if [ -n "$status" ] && [[ $description != *"$DIGEST"* ]]; then
              seen="$state for another build"
              state=''
            else
              seen=${state:-none yet}
            fi
            if [ -n "$state" ] && [ "$acknowledged" = false ]; then
              echo "$CONTEXT acknowledged this build: $state: $description"
              acknowledged=true
            fi
            case $state in
              success) echo "$CONTEXT: success: $description"; exit 0 ;;
              failure | error) echo "::error::$CONTEXT: $state: $description"; exit 1 ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::$CONTEXT did not succeed for this build within $TIMEOUT minutes (last: $seen)"
              exit 1
            fi
            if [ "$acknowledged" = false ] && [ "$SECONDS" -ge "$ack_deadline" ]; then
              echo "::error::no end-to-end system acknowledged this build within $ACK_TIMEOUT minutes (last: $seen)"
              exit 1
            fi
            echo "$CONTEXT: $seen"
            sleep 30
          done

  # the staged bytes, with their signatures, SBOMs and attestations, under the public names
  promote:
    needs: [version, goreleaser, chart, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE_DIGEST: ${{ needs.goreleaser.outputs.digest }}
      CHART_DIGEST: ${{ needs.chart.outputs.digest }}
    steps:
      - &regctl
        name: regctl
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/regctl" https://github.com/regclient/regclient/releases/download/v0.11.7/regctl-linux-amd64
          echo "3737fbbdd791e04e7a831640b681f3397a376498e80e2ad9b1b2d27296f239bc  $RUNNER_TEMP/regctl" | sha256sum --check --quiet
          chmod +x "$RUNNER_TEMP/regctl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - &login
        name: registry login
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | regctl registry login ghcr.io -u "$ACTOR" --pass-stdin
      - name: copy
        run: |
          set -euo pipefail
          # --referrers: signatures and attestations; --digest-tags: the SBOMs ko attaches as sha256-<digest>.sbom
          regctl image copy --referrers --digest-tags "$IMAGE_STAGING@$IMAGE_DIGEST" "$IMAGE:$VERSION"
          regctl image copy --referrers --digest-tags "$CHART_STAGING@$CHART_DIGEST" "$CHART:$VERSION"
          echo "Image: \`$IMAGE@$IMAGE_DIGEST\`, chart: \`$CHART@$CHART_DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

  # the draft becomes the release, with both digests in its notes
  publish:
    needs: [version, goreleaser, chart, promote]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: v${{ needs.version.outputs.version }}
          NOTES: ${{ needs.version.outputs.notes }}
          IMAGE_DIGEST: ${{ needs.goreleaser.outputs.digest }}
          CHART_DIGEST: ${{ needs.chart.outputs.digest }}
        run: |
          set -euo pipefail
          id=$(gh api --paginate "repos/$REPO/releases" --jq '.[] | select(.draft and .tag_name == env.TAG) | .id')
          test "$(wc -w <<< "$id")" -eq 1 || { echo "::error::expected one draft release for $TAG, found: $id"; exit 1; }
          # shellcheck disable=SC2016 # the backticks are Markdown
          {
            printf '%s\n\n' "$NOTES"
            printf '**Image:** `%s@%s`\n\n' "$IMAGE" "$IMAGE_DIGEST"
            printf '**Chart:** `oci://%s:%s` (`%s`)\n' "$CHART" "${TAG#v}" "$CHART_DIGEST"
          } > notes.md
          gh api -X PATCH "repos/$REPO/releases/$id" -F draft=false -F body=@notes.md --jq .html_url

  # what was published, checked from the public names only; a failure is reported, nothing is rolled back
  verify:
    needs: [version, goreleaser, chart, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # the release's files
      contents: read
      packages: read
      attestations: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE_DIGEST: ${{ needs.goreleaser.outputs.digest }}
      CHART_DIGEST: ${{ needs.chart.outputs.digest }}
      IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - *regctl
      - *login
      # cosign and docker read Docker's configuration, helm its own
      - name: docker and helm login
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
      - name: verify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PUBLIC: ${{ github.event.repository.visibility == 'public' }}
        run: |
          set -euo pipefail
          failed=0
          check() { # description, command...
            local what=$1; shift
            if "$@" > "$RUNNER_TEMP/check.log" 2>&1; then
              echo "ok: $what"
            else
              echo "::error::$what"; cat "$RUNNER_TEMP/check.log"; failed=1
            fi
          }
          # shellcheck disable=SC2329 # called through check
          equal() { [ "$1" = "$2" ] || { echo "got $1, want $2"; return 1; }; }
          check "the image's tag is the staged digest" equal "$(regctl image digest "$IMAGE:$VERSION")" "$IMAGE_DIGEST"
          check "the chart's tag is the staged digest" equal "$(regctl image digest "$CHART:$VERSION")" "$CHART_DIGEST"
          check "the image is signed by the release workflow" \
            cosign verify "$IMAGE@$IMAGE_DIGEST" --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER"
          check "the chart is signed by the release workflow" \
            cosign verify "$CHART@$CHART_DIGEST" --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER"
          check "the chart runs the release's image by digest" equal \
            "$(helm show values "oci://$CHART" --version "$VERSION" | yq '.image.repository + "@" + .image.digest')" \
            "$IMAGE@$IMAGE_DIGEST"
          mkdir assets
          check "the release's files download" gh release download "v$VERSION" --repo "$REPO" --dir assets
          check "checksums.txt is signed by the release workflow" \
            cosign verify-blob assets/checksums.txt --bundle assets/checksums.txt.sigstore.json \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER"
          check "every file checksums.txt lists matches it" bash -c 'cd assets && sha256sum --check --strict checksums.txt'
          # pulled first, so the pull's progress isn't in what --version prints
          docker pull --quiet "$IMAGE@$IMAGE_DIGEST" >/dev/null || true
          check "the image runs and reports $VERSION" \
            equal "$(docker run --rm --pull never "$IMAGE@$IMAGE_DIGEST" --version 2>&1)" "matchstick $VERSION"
          if [ "$PUBLIC" = true ]; then
            check "the image's build provenance" gh attestation verify "oci://$IMAGE@$IMAGE_DIGEST" --repo "$REPO"
            check "the chart's build provenance" gh attestation verify "oci://$CHART@$CHART_DIGEST" --repo "$REPO"
            for file in assets/*.tar.gz assets/checksums.txt; do
              check "${file#assets/}'s build provenance" gh attestation verify "$file" --repo "$REPO"
            done
          fi
          exit "$failed"
