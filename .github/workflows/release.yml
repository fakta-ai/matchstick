# A version tag (vX.Y.Z) publishes a release: the binaries, their SBOMs and signed checksums, and the container image
# ghcr.io/fakta-ai/matchstick:<version> (.goreleaser.yaml), and the Helm chart oci://ghcr.io/fakta-ai/charts/matchstick
# with version and appVersion <version>. The image, the chart and checksums.txt are signed with Sigstore, keyless: the
# signature's certificate names this workflow at the tag, and is recorded in Sigstore's public transparency log. Once
# the repository is public, the archives, checksums.txt, the image and the chart also get GitHub's build provenance
# attestations. The release notes are the version's section of CHANGELOG.md, with the image's and the chart's digests.
# Nothing is built unless the tagged commit is on main and ci.yml's run for it there passed; the GitHub release stays a
# draft until every part is published.
name: release
on:
  push:
    tags: ["v*.*.*"]
permissions: {}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # ci.yml's runs
      actions: read
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      - name: the commit is on main
        run: |
          set -euo pipefail
          # main is the tagged commit or ahead of it
          status=$(gh api "repos/$REPO/compare/$SHA...main" --jq .status)
          case $status in
            identical | ahead) echo "$SHA is on main" ;;
            *) echo "::error::$SHA is not on main (main is $status of it)"; exit 1 ;;
          esac
      - name: main's checks passed
        run: |
          set -euo pipefail
          # ci.yml's run for this commit's push to main: wait while it runs; fail if it failed or never started
          started=$SECONDS
          while :; do
            run=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&branch=main&per_page=1" \
              --jq '.workflow_runs[0] // empty | "\(.status) \(.conclusion) \(.html_url)"')
            if [ -z "$run" ]; then
              if [ $((SECONDS - started)) -ge 120 ]; then
                echo "::error::ci.yml never ran for $SHA on main"
                exit 1
              fi
            else
              read -r status conclusion url <<< "$run"
              if [ "$status" = completed ]; then
                if [ "$conclusion" = success ]; then
                  echo "ci.yml passed for $SHA on main: $url"
                  exit 0
                fi
                echo "::error::ci.yml's run for $SHA on main ended $conclusion: $url"
                exit 1
              fi
              echo "ci.yml's run for $SHA on main is $status: $url"
            fi
            sleep 15
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - name: notes
        id: notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # the version's section of CHANGELOG.md
          awk -v v="${VERSION#v}" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no section for ${VERSION#v}"; exit 1; }
          delimiter=$(openssl rand -hex 16)
          printf 'notes<<%s\n%s\n%s\n' "$delimiter" "$(cat notes.md)" "$delimiter" >> "$GITHUB_OUTPUT"

  # the binaries, checksums, SBOMs and image; signed; a draft release with the files
  goreleaser:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # the draft release and its files
      contents: write
      # the image, and its attestation
      packages: write
      # the OIDC token Sigstore issues the signing certificates for
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # restores main's Go caches; the same go.sum's key already exists, so the tag's run saves none
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0
      - name: registry login
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: notes
        env:
          NOTES: ${{ needs.gate.outputs.notes }}
        run: printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: image
        id: image
        run: |
          set -euo pipefail
          digest=$(jq -r '.[] | select(.type == "Docker Manifest") | .extra.Digest' dist/artifacts.json)
          test -n "$digest" || { echo "::error::GoReleaser published no image"; exit 1; }
          echo "ref=ghcr.io/fakta-ai/matchstick@$digest" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # GitHub's attestations need a public repository, or GitHub Enterprise Cloud
      - if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
      - if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/fakta-ai/matchstick
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  chart:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # the chart, and its attestation
      packages: write
      # the OIDC token Sigstore issues the signing certificate for
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      # helm push reads Helm's registry configuration; cosign and the chart's attestation read Docker's
      - name: registry login
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: push
        id: push
        run: |
          set -euo pipefail
          # the chart's version and appVersion are the release's, so its default image is this release's
          helm package deploy/chart/matchstick --version "${VERSION#v}" --app-version "${VERSION#v}" --destination chart
          helm push "chart/matchstick-${VERSION#v}.tgz" oci://ghcr.io/fakta-ai/charts 2>&1 | tee push.log
          digest=$(awk '$1 == "Digest:" {print $2}' push.log)
          test -n "$digest" || { echo "::error::helm push printed no digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: sign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "ghcr.io/fakta-ai/charts/matchstick@$DIGEST"
      # GitHub's attestations need a public repository, or GitHub Enterprise Cloud
      - if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/fakta-ai/charts/matchstick
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # the draft becomes the release, with both digests in its notes
  publish:
    needs: [gate, goreleaser, chart]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ needs.gate.outputs.notes }}
          IMAGE: ${{ needs.goreleaser.outputs.image }}
          CHART: ${{ needs.chart.outputs.digest }}
        run: |
          set -euo pipefail
          id=$(gh api --paginate "repos/$REPO/releases" --jq '.[] | select(.draft and .tag_name == env.TAG) | .id')
          test "$(wc -w <<< "$id")" -eq 1 || { echo "::error::expected one draft release for $TAG, found: $id"; exit 1; }
          # shellcheck disable=SC2016 # the backticks are Markdown
          {
            printf '%s\n\n' "$NOTES"
            printf '**Image:** `%s`\n\n' "$IMAGE"
            printf '**Chart:** `oci://ghcr.io/fakta-ai/charts/matchstick:%s` (`%s`)\n' "${TAG#v}" "$CHART"
          } > notes.md
          gh api -X PATCH "repos/$REPO/releases/$id" -F draft=false -F body=@notes.md --jq .html_url
