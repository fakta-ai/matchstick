apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "matchstick.fullname" . }}
  labels:
    {{- include "matchstick.labels" . | nindent 4 }}
data:
  matchstick.yaml: |
    {{- $listen := dict "listen" (dict "metrics" (printf ":%d" (int .Values.metrics.port)) "admin" "127.0.0.1:9091") }}
    {{- toYaml (merge $listen (omit .Values.config "listen")) | nindent 4 }}
