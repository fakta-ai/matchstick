apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "matchstick.fullname" . }}
  labels:
    {{- include "matchstick.labels" . | nindent 4 }}
spec:
  # One copy only, replaced rather than overlapped.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "matchstick.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "matchstick.selector" . | nindent 8 }}
        azure.workload.identity/use: "true"
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "matchstick.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: matchstick
          image: "{{ .Values.image.repository }}{{ with .Values.image.digest }}@{{ . }}{{ else }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["run", "--config", "/etc/matchstick/matchstick.yaml"]
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            - name: claim
              containerPort: {{ .Values.claim.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/matchstick
              readOnly: true
            - name: github
              mountPath: /var/run/secrets/matchstick
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "matchstick.fullname" . }}
        - name: github
          secret:
            secretName: {{ .Values.githubSecret.name }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
