apiVersion: v1
kind: Service
metadata:
  name: {{ include "matchstick.fullname" . }}-claim
  labels:
    {{- include "matchstick.labels" . | nindent 4 }}
  {{- with .Values.claim.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.claim.service.type }}
  selector:
    {{- include "matchstick.selector" . | nindent 4 }}
  ports:
    - name: claim
      port: {{ .Values.claim.port }}
      targetPort: claim
