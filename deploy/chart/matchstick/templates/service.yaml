{{- if .Values.metrics.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "matchstick.fullname" . }}
  labels:
    {{- include "matchstick.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "matchstick.selector" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
{{- end }}
