image:
  repository: ghcr.io/fakta-ai/matchstick
  # Defaults to the chart's appVersion.
  tag: ""
  # sha256:..., which pins the image exactly; when set, tag is ignored.
  digest: ""
  pullPolicy: IfNotPresent

# matchstick's configuration file (docs/configuration.md), without secrets. listen addresses are set by the chart.
# With azure, set claimURL to the claim Service's address as the VMs reach it, such as https://10.20.0.4:8443/claim.
config:
  instance: ci
  pools: []

# Further files beside the configuration, mounted at /etc/matchstick/<name>, such as a pool's azure.customData:
#   --set-file files.cloud-init\.yaml=cloud-init.yaml, with customData: /etc/matchstick/cloud-init.yaml
files: {}

# The Secret holding the GitHub credential: a key github-app-private-key (with config.github.app) or github-token.
# Created outside the chart.
githubSecret:
  name: matchstick-github

serviceAccount:
  create: true
  name: ""
  # Azure workload identity: the client ID of the managed identity matchstick signs in as.
  azureClientID: ""
  annotations: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

metrics:
  port: 9090
  service:
    enabled: true

# The claim endpoint, where VMs fetch their runner configuration over TLS. matchstick makes its key at start, in
# memory; there is no Secret for it. The VMs' subnet must reach the Service, and nothing may terminate TLS in front of
# it.
claim:
  port: 8443
  service:
    # LoadBalancer, NodePort or ClusterIP.
    type: LoadBalancer
    # The load balancer's annotations, for the cluster's cloud. The default makes an internal Azure load balancer, so
    # that VMs in the virtual network reach it; to give it a fixed address for claimURL, add
    # service.beta.kubernetes.io/azure-load-balancer-ipv4: <address>. On another cloud, set its internal load
    # balancer's annotations, and the Azure one to null to drop it. The load balancer's TCP health probe on the claim
    # port needs no setting: matchstick counts connections that close without a byte in matchstick_claim_probes_total
    # and does not log them.
    annotations:
      service.beta.kubernetes.io/azure-load-balancer-internal: "true"

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
